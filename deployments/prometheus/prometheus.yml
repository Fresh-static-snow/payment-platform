global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8080"]

  - job_name: payment-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-worker:8081"]

  - job_name: risk-service
    metrics_path: /metrics
    static_configs:
      - targets: ["risk-service:8086"]

  - job_name: ledger-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ledger-service:8085"]

  - job_name: receipt-service
    metrics_path: /metrics
    static_configs:
      - targets: ["receipt-service:8083"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8084"]

  - job_name: workflow-service
    metrics_path: /metrics
    static_configs:
      - targets: ["workflow-service:8087"]

  - job_name: payment-search-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-search-indexer:8088"]

  - job_name: payment-search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-search-service:8089"]

  - job_name: analytics-ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-ingestor:8090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
