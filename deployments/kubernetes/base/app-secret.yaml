apiVersion: v1
kind: Secret
metadata:
  name: payment-platform-secrets
  annotations:
    payment-platform.dev/replace-before-production: "true"
type: Opaque
stringData:
  DATABASE_URL: postgres://payment:change-me@postgres:5432/payments?sslmode=disable
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
  CLICKHOUSE_PASSWORD: change-me
