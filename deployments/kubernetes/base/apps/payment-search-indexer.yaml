apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-search-indexer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-search-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-search-indexer
        app.kubernetes.io/component: search-projection
    spec:
      serviceAccountName: payment-platform
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-search-indexer
          image: payment-platform/payment-search-indexer:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: payment-platform-config
            - secretRef:
                name: payment-platform-secrets
          env:
            - name: HTTP_PORT
              value: "8088"
          ports:
            - name: http
              containerPort: 8088
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 75m, memory: 96Mi}
            limits: {cpu: 750m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-search-indexer
  labels:
    app.kubernetes.io/name: payment-search-indexer
spec:
  selector:
    app.kubernetes.io/name: payment-search-indexer
  ports:
    - name: http
      port: 8088
      targetPort: http
