apiVersion: v1
kind: Service
metadata:
  name: debezium
  labels:
    app.kubernetes.io/name: debezium
spec:
  selector:
    app.kubernetes.io/name: debezium
  ports:
    - {name: http, port: 8083, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: debezium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debezium
        app.kubernetes.io/component: change-data-capture
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: debezium
          image: quay.io/debezium/connect:3.6.2.Final
          env:
            - {name: BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: GROUP_ID, value: payment-debezium-connect}
            - {name: CONFIG_STORAGE_TOPIC, value: payment.connect-configs}
            - {name: OFFSET_STORAGE_TOPIC, value: payment.connect-offsets}
            - {name: STATUS_STORAGE_TOPIC, value: payment.connect-status}
            - {name: CONFIG_STORAGE_REPLICATION_FACTOR, value: "1"}
            - {name: OFFSET_STORAGE_REPLICATION_FACTOR, value: "1"}
            - {name: STATUS_STORAGE_REPLICATION_FACTOR, value: "1"}
            - {name: KEY_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter}
            - {name: VALUE_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter}
            - {name: KEY_CONVERTER_SCHEMAS_ENABLE, value: "false"}
            - {name: VALUE_CONVERTER_SCHEMAS_ENABLE, value: "false"}
            - {name: REST_ADVERTISED_HOST_NAME, value: debezium}
            - {name: OFFSET_FLUSH_INTERVAL_MS, value: "1000"}
            - {name: CONNECT_CONFIG_PROVIDERS, value: directory}
            - {name: CONNECT_CONFIG_PROVIDERS_DIRECTORY_CLASS, value: org.apache.kafka.common.config.provider.DirectoryConfigProvider}
            - {name: CONNECT_CONFIG_PROVIDERS_DIRECTORY_PARAM_ALLOWED_PATHS, value: /opt/kafka/secrets}
          ports:
            - {name: http, containerPort: 8083}
          startupProbe:
            httpGet: {path: /connectors, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /connectors, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /connectors, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: database-credentials
              mountPath: /opt/kafka/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: database-credentials
          secret:
            secretName: payment-platform-infrastructure-secrets
            defaultMode: 0440
            items:
              - {key: POSTGRES_DB, path: POSTGRES_DB}
              - {key: POSTGRES_USER, path: POSTGRES_USER}
              - {key: POSTGRES_PASSWORD, path: POSTGRES_PASSWORD}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-connector-init
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debezium-connector-init
        app.kubernetes.io/component: change-data-capture
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-outbox-schema
          image: postgres:18.6-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until [ "$(psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT to_regclass('public.outbox_events') IS NOT NULL")" = "t" ]; do
                sleep 3
              done
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: payment-platform-infrastructure-secrets, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: payment-platform-infrastructure-secrets, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: payment-platform-infrastructure-secrets, key: POSTGRES_PASSWORD}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: configure
          image: curlimages/curl:8.16.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until curl --fail --silent --show-error http://debezium:8083/connectors >/dev/null; do sleep 3; done
              if curl --fail --silent http://debezium:8083/connectors/payment-outbox >/dev/null; then
                curl --fail --silent --show-error \
                  -X PUT \
                  -H 'Content-Type: application/json' \
                  --data-binary @/config/debezium-connector-config.json \
                  http://debezium:8083/connectors/payment-outbox/config
              else
                curl --fail --silent --show-error \
                  -X POST \
                  -H 'Content-Type: application/json' \
                  --data-binary @/config/debezium-connector.json \
                  http://debezium:8083/connectors
              fi

              attempt=0
              status=""
              while [ "$attempt" -lt 120 ]; do
                status="$(curl --fail --silent http://debezium:8083/connectors/payment-outbox/status || true)"
                running="$(printf '%s' "$status" | grep -Eo '"state"[[:space:]]*:[[:space:]]*"RUNNING"' | wc -l | tr -d ' ')"
                if [ "$running" -ge 2 ]; then
                  exit 0
                fi
                attempt=$((attempt + 1))
                sleep 3
              done
              printf 'connector did not become ready: %s\n' "$status" >&2
              exit 1
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: connector, mountPath: /config, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: connector
          configMap:
            name: debezium-connector
