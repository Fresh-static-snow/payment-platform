apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          args:
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: payment-platform-infrastructure-secrets, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: payment-platform-infrastructure-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: payment-platform-infrastructure-secrets, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          ports:
            - {name: redis, containerPort: 6379}
          startupProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: event-bus
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: broker}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
spec:
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - {name: edge, port: 4566, targetPort: edge}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/component: aws-emulator
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8.1
          env:
            - {name: SERVICES, value: "s3,sqs,sns"}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: AWS_ACCOUNT_ID, value: "000000000000"}
            - {name: S3_BUCKET, value: payment-receipts}
            - {name: SQS_QUEUE_NAME, value: payment-notifications}
            - {name: SQS_DLQ_NAME, value: payment-dlq}
            - {name: SNS_TOPIC_NAME, value: payment-notifications}
          ports:
            - {name: edge, containerPort: 4566}
          startupProbe:
            httpGet: {path: /_localstack/health, port: edge}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /_localstack/health, port: edge}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /_localstack/health, port: edge}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/localstack}
            - {name: init, mountPath: /etc/localstack/init/ready.d/init-aws.sh, subPath: init-aws.sh, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: localstack-init
            defaultMode: 0555
