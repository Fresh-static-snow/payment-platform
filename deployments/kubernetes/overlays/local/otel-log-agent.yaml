apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-log-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-log-agent
        app.kubernetes.io/component: log-collector
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-log-agent
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otelcol-contrib/config.yml"]
          ports:
            - {name: health, containerPort: 13133}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib/config.yml, subPath: otel-log-agent.yml, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: otel-log-agent-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
