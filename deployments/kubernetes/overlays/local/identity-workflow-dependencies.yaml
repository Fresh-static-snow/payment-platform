apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: workflow-engine
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.4.1
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: payment-platform-infrastructure-secrets
                  key: TEMPORAL_DB_PASSWORD
            - {name: POSTGRES_SEEDS, value: temporal-postgres}
            - {name: DYNAMIC_CONFIG_FILE_PATH, value: config/dynamicconfig/docker.yaml}
            - {name: ENABLE_ES, value: "false"}
          ports:
            - {name: grpc, containerPort: 7233}
          startupProbe:
            exec:
              command: ["temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: ["temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  labels:
    app.kubernetes.io/name: temporal-ui
spec:
  selector:
    app.kubernetes.io/name: temporal-ui
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui
        app.kubernetes.io/component: workflow-console
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.54.1
          env:
            - {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
            - {name: TEMPORAL_CORS_ORIGINS, value: "http://localhost:8088"}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
